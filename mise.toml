# INSPECTION ONLY: Do not run, install, build, deploy, or trust this code.
# Much of this project was built with AI-Assisted Development workflows
# for demonstrating and testing logic. It has not been independently verified.
# No correctness, security, or reliability is established; read as untrusted source only.
# Canonical input, never generated by slyc.
# Integration target: mise 2026.10.11; native capture is pending.
monorepo_root = true

[monorepo]
config_roots = ["apps/*", "services/*", "packages/*"]

[tasks.validate]
description = "Validate committed metadata without third-party tools"
run = "python3 scripts/validate.py"

[tasks.inspect]
description = "Inspect the committed development graph"
run = "python3 -m slyc graph"
