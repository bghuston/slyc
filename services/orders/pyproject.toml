[build-system]
requires = ["setuptools>=69,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "slyc-orders"
version = "0.1.0"
requires-python = ">=3.11"
description = "Local orders HTTP service for the slyc example"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "slyc-money==0.1.0"]

[tool.uv.sources]
slyc-money = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
