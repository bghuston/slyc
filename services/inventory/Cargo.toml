[package]
name = "slyc-inventory"
version = "0.1.0"
edition = "2021"
description = "Local HTTP inventory service for slyc"

[dependencies]
slyc-inventory-core = { path = "../../packages/inventory-core" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
serde = { version = "1", features = ["derive"] }
